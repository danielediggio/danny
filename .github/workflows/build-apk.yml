name: Build APK

# Compila l'APK di obdiggio sui runner cloud di GitHub (rete aperta: nessun
# blocco ai download di github richiesti da Buildozer/python-for-android).
#
# Due modi per avviarla:
#   * "Run workflow" (workflow_dispatch) dalla tab Actions — scegli il branch
#     claude/obd2-program-keevsv per compilare il codice dell'app.
#   * automaticamente ad ogni push su quel branch che tocca obdiggio/.
#
# L'APK finisce come artifact scaricabile della run. Se configuri i tre secret
# email (vedi README) viene anche inviato via email in allegato.
#
# NB: Buildozer viene eseguito direttamente sul runner (non tramite action di
# terze parti, che al momento hanno l'immagine Docker rotta), installando Java
# e le dipendenze dai repository standard.

# Solo avvio manuale: la versione Kotlin nativa (obdiggio-android) è quella
# supportata e compila in modo affidabile. Questa build Python/Buildozer arriva
# fino all'ultimo passo (packaging Gradle) ma resta fragile: la lasciamo
# disponibile on-demand senza farla partire (e fallire) a ogni push.
on:
  workflow_dispatch:

permissions:
  contents: write        # necessario per creare/aggiornare la Release

# Un nuovo avvio annulla quello precedente ancora in corso sullo stesso branch.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04: autoconf/libtool compatibili con l'autogen di libffi (su 24.04
    # fallisce con "possibly undefined macro: LT_SYS_SYMBOL_USCORE").
    runs-on: ubuntu-22.04
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica presenza progetto
        run: |
          if [ ! -f obdiggio/buildozer.spec ]; then
            echo "::error::obdiggio/buildozer.spec non trovato. Avvia la build sul branch claude/obd2-program-keevsv."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git zip unzip \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Installa Buildozer + Cython (versioni collaudate)
        run: |
          python -m pip install --upgrade pip
          # Stack noto-funzionante con Kivy 2.3.0 e Python 3.11 (via p4a v2024.01.21):
          pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Cache SDK/NDK/recipe (~/.buildozer)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('obdiggio/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK (debug)
        working-directory: obdiggio
        run: buildozer android debug

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: obdiggio-debug-apk
          path: obdiggio/bin/*.apk
          if-no-files-found: error

      - name: Pubblica l'APK come Release (link diretto per il telefono)
        if: ${{ success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-debug
          name: obdiggio — APK debug
          body: |
            APK di debug di obdiggio compilato automaticamente.

            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Build:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Dal telefono: tocca il file `.apk` qui sotto per scaricarlo, poi
            installalo (serve attivare "Installa app da origini sconosciute").
          prerelease: true
          make_latest: true
          files: obdiggio/bin/*.apk
          fail_on_unmatched_files: true

      - name: Invia l'APK via email (opzionale)
        if: ${{ success() && env.MAIL_USERNAME != '' && env.MAIL_TO != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: obdiggio CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "obdiggio — APK build ${{ github.run_number }}"
          body: |
            Ciao!
            In allegato trovi l'APK di obdiggio appena compilato.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: obdiggio/bin/*.apk
